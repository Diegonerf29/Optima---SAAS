# integracion continua: compila y pasa todos los tests en cada push y pull request
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # los tests de integracion arrancan MySQL con Testcontainers (Docker ya viene en el runner)
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      # comprueba que el Dockerfile sigue construyendo (en la fase 8 ademas se publica)
      - name: Construir la imagen
        run: docker build -t optima-api:ci .
