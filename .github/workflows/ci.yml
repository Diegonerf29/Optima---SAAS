# integracion continua: compila y pasa todos los tests en cada push y pull request
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # los tests de integracion arrancan MySQL con Testcontainers (Docker ya viene en el runner)
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formato y lint
        run: npm run format:check && npm run lint

      - name: Tipos y tests
        run: npm run typecheck && npm test

      - name: Build
        run: npm run build

  e2e:
    name: Recorridos en el navegador (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # MySQL con el usuario y la base de datos que espera el perfil dev
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: optima_db
          MYSQL_USER: optima_user
          MYSQL_PASSWORD: optima_pass
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Arrancar la API (perfil dev)
        run: |
          ./mvnw -B -q -DskipTests package
          SPRING_PROFILES_ACTIVE=dev nohup java -jar target/*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat api.log; exit 1

      - name: Dependencias y Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Recorridos
        working-directory: frontend
        run: npm run e2e

      - name: Guardar las trazas si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            frontend/test-results
            api.log

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # comprueba que los Dockerfile siguen construyendo (en la fase 8 ademas se publican)
      - name: Imagen de la API
        run: docker build -t optima-api:ci .

      - name: Imagen de la web (frontend + Caddy)
        run: docker build -f frontend/Dockerfile -t optima-web:ci .

      - name: Comprobar el Caddyfile
        run: docker run --rm -e DOMAIN=localhost optima-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
