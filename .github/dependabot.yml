# avisa con un pull request cuando hay versiones nuevas de dependencias
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # frontend: las versiones menores y parches llegan juntas en un solo pull request
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly

  # imagenes base de los Dockerfile (API y web)
  - package-ecosystem: docker
    directories: [/, /frontend]
    target-branch: develop
    schedule:
      interval: monthly
