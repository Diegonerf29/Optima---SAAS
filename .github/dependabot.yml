# avisa con un pull request cuando hay versiones nuevas de dependencias
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # frontend: las versiones menores y parches llegan juntas en un solo pull request
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    # saltos de version mayor que se hacen a mano y con calma, no con un PR automatico:
    # - typescript 7 es el compilador nuevo (escrito en Go); hay que esperar a que lo soporte todo el ecosistema
    # - @types/node sigue la version de Node que se usa (24 LTS)
    # - @hookform/resolvers 6 no encaja aun con react-hook-form 7
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@hookform/resolvers'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly

  # imagenes base de los Dockerfile (API y web)
  - package-ecosystem: docker
    directories: [/, /frontend]
    target-branch: develop
    schedule:
      interval: monthly
    # Java y Node se quedan en sus versiones LTS (las mismas que la CI): 21 y 24
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
