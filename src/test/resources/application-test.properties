# perfil de tests: se activa con @ActiveProfiles("test")
# clave solo para tests (no es la de desarrollo ni la de produccion)
app.jwt.secret=clave-de-tests-automaticos-no-usar-fuera-de-los-tests-0123456789

# sin llamadas a servicios externos
app.geocoding.enabled=false
spring.mail.host=localhost
spring.mail.port=1

# sin ruido de SQL en la salida de los tests
spring.jpa.show-sql=false

# los tests usan los datos de demo
spring.flyway.locations=classpath:db/migration,classpath:db/demo
