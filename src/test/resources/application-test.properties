# perfil de tests: se activa con @ActiveProfiles("test")
# clave solo para tests (no es la de desarrollo ni la de produccion)
app.jwt.secret=clave-de-tests-automaticos-no-usar-fuera-de-los-tests-0123456789

# sin llamadas a servicios externos
app.geocoding.enabled=false
spring.mail.host=localhost
spring.mail.port=1

# sin ruido de SQL en la salida de los tests
spring.jpa.show-sql=false

# los tests usan los datos de demo
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# pagos encendidos con claves falsas: Stripe se sustituye por un doble en los tests de pagos
app.billing.enabled=true
app.billing.stripe.secret-key=sk_test_falsa
app.billing.stripe.price-id=price_falso
app.billing.stripe.webhook-secret=whsec_secreto_de_los_tests

# todos los tests salen de la misma ip: el limite de intentos se prueba aparte
app.rate-limit.enabled=false

# usuario de la base de datos de los tests (Testcontainers lo sobrescribe con @ServiceConnection)
spring.datasource.username=test
spring.datasource.password=test
