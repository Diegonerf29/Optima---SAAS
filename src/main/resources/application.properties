# configuracion de PRODUCCION (valores seguros por defecto)
# en local se arranca con el perfil dev: SPRING_PROFILES_ACTIVE=dev (application-dev.properties)
# los secretos llegan por variables de entorno (.env); ver .env-example

# aplicacion
spring.application.name=api
server.port=8080

# al apagar (por ejemplo al desplegar una version nueva) se terminan las peticiones en curso
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# detras de Caddy: Tomcat toma la ip real de X-Forwarded-For solo si la peticion
# llega desde una red privada (el proxy). Un cliente de Internet no puede falsearla
server.forward-headers-strategy=native

# limite de intentos en login, registro y recuperacion de contraseña
app.rate-limit.enabled=true

# base de datos
# usuario y contraseña sin valor por defecto: si faltan DB_USERNAME o DB_PASSWORD la app no arranca
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:optima_db}?allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# persistencia
# las tablas las crea Flyway (src/main/resources/db/migration); Hibernate solo comprueba al arrancar
# que las entidades coinciden con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# migraciones
spring.flyway.locations=classpath:db/migration
# una base de datos creada antes de Flyway (con el antiguo docs/schema_v20.sql) se marca como V1
# y solo se le aplican las migraciones nuevas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# paginas por defecto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# formato estable de las paginas: {content, page: {size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto

# la api solo usa tokens JWT, no hace falta el usuario en memoria de Spring Security
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# clave de acceso
# sin valor por defecto: si falta JWT_SECRET la app no arranca
app.jwt.secret=${JWT_SECRET}
# una jornada (12 h): el PC de recepcion no pide entrar otra vez a mitad del dia
app.jwt.expiration-ms=${JWT_EXPIRATION:43200000}

# origenes permitidos (la direccion del frontend; varias separadas por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# correo saliente (cualquier proveedor SMTP: Brevo, Resend, Amazon SES, Gmail...)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# remitente; con un proveedor propio suele ser algo como no-reply@tudominio.com
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@optima.local}}

# suscripciones con Stripe (fase 9). Apagado no se cobra ni se bloquea a nadie (desarrollo, demo)
# encendido hacen falta las tres claves de Stripe, o la app no arranca
app.billing.enabled=${BILLING_ENABLED:false}
app.billing.trial-days=14
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.price-id=${STRIPE_PRICE_ID:}

# enlaces enviados por correo
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# mapas (Nominatim exige identificar la aplicacion con una web o un email de contacto)
app.geocoding.user-agent=${GEOCODING_USER_AGENT:optima/1.0 (+https://github.com/Diegonerf29/Optima---SAAS)}
app.geocoding.timeout-ms=5000

# salud: solo GET /actuator/health es publico y no da detalles (Docker y el aviso de caidas lo consultan)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# un fallo del correo no debe marcar la api como caida (Docker la reiniciaria sin motivo)
management.health.mail.enabled=false

# documentacion: apagada en produccion (SWAGGER_ENABLED=true para activarla)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# las respuestas son JSON (el frontend genera sus tipos a partir de /v3/api-docs)
springdoc.default-produces-media-type=application/json
