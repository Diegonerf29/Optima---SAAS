# perfil de desarrollo: solo se carga con SPRING_PROFILES_ACTIVE=dev
# todo lo que esta aqui es comodo para trabajar en local y NO sirve para produccion

# clave publica de desarrollo, nunca usarla en produccion (JwtUtil la rechaza fuera de dev)
app.jwt.secret=dev-secret-solo-para-local-no-usar-en-produccion-0123456789

# base de datos local (la de docker-compose.yml)
spring.datasource.username=${DB_USERNAME:optima_user}
spring.datasource.password=${DB_PASSWORD:optima_pass}

# en local tambien se cargan los datos de demo (usuarios con contraseña 12345678)
spring.flyway.locations=classpath:db/migration,classpath:db/demo
# una base local antigua (schema_v20.sql) ya trae los datos de demo: se marca como V1.1
spring.flyway.baseline-version=1.1

# ver las consultas SQL y tener Swagger en http://localhost:8080/swagger-ui.html
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# el frontend de Vite
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
