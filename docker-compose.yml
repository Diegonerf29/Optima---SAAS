# entorno de DESARROLLO: MySQL + API con recarga en caliente (perfil dev, datos de demo)
# uso: docker compose up
# la API queda en http://localhost:8080 y Swagger en http://localhost:8080/swagger-ui.html
# para PRODUCCION se usa docker-compose.prod.yml
services:
  mysqldb:
    image: mysql:8.4
    container_name: optima_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: optima_db
      # contraseñas solo para desarrollo
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: optima_user
      MYSQL_PASSWORD: optima_pass
      TZ: Europe/Madrid
    # solo accesible desde tu ordenador (127.0.0.1), nunca desde la red
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    # la api espera a que mysql responda de verdad y no solo a que arranque
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uoptima_user", "-poptima_pass"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: maven:3.9-eclipse-temurin-21
    container_name: optima_api_dev
    working_dir: /app
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    command: ./mvnw spring-boot:run
    # .env es opcional en local (por ejemplo para probar el correo)
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysqldb
      DB_PORT: 3306
      TZ: Europe/Madrid
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=true -Dspring.devtools.restart.pollInterval=1000 -Dspring.devtools.restart.quietPeriod=400"
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: ".reloadtrigger"

volumes:
  db_data:
